<!-- RESULT PAGE -->
<div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-12">

  <!-- Tombol kembali ke history siswa (untuk admin/pengajar yang mereview dari public-history) -->
  <template x-if="result.data && result.data.user_id !== user?.id && (user?.role === 'admin' || user?.role === 'pengajar') && publicHistory.filterType === 'user'">
    <button @click="navigate('/public-history')"
            class="inline-flex items-center gap-1.5 text-sm text-gray-500 dark:text-gray-400 hover:text-primary-600 dark:hover:text-primary-400 transition-colors mb-5 group">
      <svg class="w-4 h-4 group-hover:-translate-x-0.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
      </svg>
      Kembali ke Histori <span class="font-semibold text-gray-700 dark:text-gray-300" x-text="publicHistory.filterLabel"></span>
    </button>
  </template>

  <!-- Tombol kembali ke papan turnamen jika melihat review dari turnamen -->
  <template x-if="result.tournamentId">
    <button @click="navigate('/tournament/' + result.tournamentId)"
            class="inline-flex items-center gap-1.5 text-xs font-bold text-amber-700 dark:text-amber-300 bg-amber-50 dark:bg-amber-900/30 border border-amber-200 dark:border-amber-700/50 py-2 px-3.5 rounded-xl hover:bg-amber-100 dark:hover:bg-amber-900/50 transition-colors mb-5 group">
      <span>🏆</span>
      <span>Kembali ke Papan Klasemen Turnamen →</span>
    </button>
  </template>

  <!-- Loading -->
  <div x-show="result.loading" class="space-y-4">
    <div class="skeleton h-10 w-1/2 mx-auto rounded-xl"></div>
    <div class="skeleton h-48 rounded-2xl"></div>
    <div class="skeleton h-64 rounded-2xl"></div>
  </div>

  <!-- Error / no data -->
  <div x-show="!result.loading && !result.data" class="text-center py-20 text-gray-400">
    <p class="text-5xl mb-4">😕</p>
    <p class="text-lg">Hasil tidak ditemukan</p>
    <button @click="navigate('/quizzes')" class="mt-4 btn-primary">← Ke Daftar Quiz</button>
  </div>

  <!-- Result -->
  <div x-show="!result.loading && result.data" class="animate-slide-up">
    <template x-if="result.data">
      <div>
        <!-- Challenge Result Card (Card Juara di Atas) -->
        <template x-if="result.challengeId">
          <div class="card p-5 mb-6 border-2 border-primary-200 dark:border-primary-800/60 bg-gradient-to-br from-primary-50/50 via-purple-50/30 to-white dark:from-primary-950/20 dark:via-purple-950/10 dark:to-gray-900 shadow-sm">
            <div class="flex items-center justify-between mb-4 pb-3 border-b border-primary-100 dark:border-primary-900/40">
              <div class="flex items-center gap-3">
                <span class="text-2xl">⚔️</span>
                <div>
                  <h3 class="font-bold text-gray-900 dark:text-white text-sm">Hasil Tantangan PvP</h3>
                  <p class="text-xs text-gray-500 dark:text-gray-400" x-text="result.challengeData?.quiz_title || 'Memuat kuis...'"></p>
                </div>
              </div>
              <span class="text-xs px-2.5 py-1 rounded-full font-semibold flex items-center gap-1.5"
                    :class="result.challengeData?.status === 'completed'
                      ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/30 dark:text-emerald-400'
                      : 'bg-amber-100 text-amber-700 dark:bg-amber-900/30 dark:text-amber-400'">
                <span x-show="result.challengeData?.status !== 'completed'" class="w-2 h-2 rounded-full bg-amber-500 animate-ping"></span>
                <span x-text="result.challengeData?.status === 'completed' ? '✓ Tanding Selesai' : '⏳ Tanding Berlangsung'"></span>
              </span>
            </div>

            <!-- Loading challenge data -->
            <template x-if="!result.challengeData">
              <div class="text-center py-6">
                <div class="w-6 h-6 border-2 border-primary-500 border-t-transparent rounded-full animate-spin mx-auto mb-2"></div>
                <p class="text-xs text-gray-500">Memuat data pertarungan...</p>
              </div>
            </template>

            <!-- KONDISI 1: TANTANGAN BELUM SELESAI (Menunggu lawan menyelesaikan kuis) -->
            <template x-if="result.challengeData && (result.challengeData.status !== 'completed' || (result.challengeData.participants || []).some(p => p.score_final === null && !p.is_submitted))">
              <div class="space-y-4">
                <!-- Info banner -->
                <div class="flex items-center justify-between bg-amber-50 dark:bg-amber-900/20 border border-amber-200/80 dark:border-amber-800/40 rounded-xl px-4 py-3 text-xs text-amber-800 dark:text-amber-300">
                  <div class="flex items-center gap-2.5 min-w-0">
                    <span class="text-base flex-shrink-0">⏳</span>
                    <div>
                      <p class="font-bold">Kamu sudah menyelesaikan kuis!</p>
                      <p class="text-amber-700 dark:text-amber-400 text-[11px] mt-0.5">Menunggu lawan menyelesaikan soal. Progres live diperbarui otomatis setiap beberapa detik...</p>
                    </div>
                  </div>
                  <button @click="api.get('challenge.status',{id:result.challengeId}).then(d=>result.challengeData=d)"
                          class="ml-3 px-2.5 py-1.5 rounded-lg bg-amber-200/70 hover:bg-amber-200 dark:bg-amber-800/40 dark:hover:bg-amber-800/60 font-semibold text-amber-900 dark:text-amber-200 transition-colors flex-shrink-0 flex items-center gap-1">
                    🔄 Refresh
                  </button>
                </div>

                <!-- Live Progress Bars Peserta (Sebagaimana saat duel kuis berlangsung) -->
                <div class="bg-white/80 dark:bg-gray-800/80 backdrop-blur-sm rounded-xl p-4 border border-gray-200/60 dark:border-gray-700/60 space-y-3.5">
                  <div class="flex items-center justify-between text-xs font-semibold text-gray-500 dark:text-gray-400 pb-1 border-b border-gray-100 dark:border-gray-700/50">
                    <span>Peserta Tanding</span>
                    <span>Progres & Live Skor</span>
                  </div>

                  <template x-for="p in [...(result.challengeData.participants || [])].sort((a,b) => (b.live_score ?? b.score_final ?? 0) - (a.live_score ?? a.score_final ?? 0))" :key="p.user_id">
                    <div class="space-y-1.5">
                      <div class="flex items-center justify-between text-xs">
                        <!-- Nama & Indikator User -->
                        <div class="flex items-center gap-2 font-bold min-w-0"
                             :class="p.user_id == (user?.id || 0) ? 'text-primary-600 dark:text-primary-400' : 'text-gray-800 dark:text-gray-200'">
                          <span class="truncate" x-text="p.user_id == (user?.id || 0) ? 'Kamu (' + p.name + ')' : p.name"></span>
                          <span x-show="p.is_host" class="text-[10px] bg-amber-100 text-amber-700 dark:bg-amber-900/40 dark:text-amber-400 px-1.5 py-0.2 rounded font-bold flex-shrink-0" title="Host Ruangan">👑 Host</span>
                          <span x-show="p.disconnected" class="text-red-500 text-[11px] flex-shrink-0" title="Koneksi terputus">⚠️ Terputus</span>
                        </div>

                        <!-- Status Badge & Nilai Persentase -->
                        <div class="flex items-center gap-2.5 flex-shrink-0">
                          <span class="text-[10px] px-2 py-0.5 rounded-full font-medium"
                                :class="p.is_submitted || p.score_final !== null
                                  ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/30 dark:text-emerald-400'
                                  : 'bg-blue-100 text-blue-700 dark:bg-blue-900/30 dark:text-blue-400'">
                            <span x-text="p.is_submitted || p.score_final !== null ? '✓ Selesai' : 'Sedang Menjawab'"></span>
                          </span>
                          <span class="font-extrabold text-sm w-12 text-right"
                                :class="p.user_id == (user?.id || 0) ? 'text-primary-600 dark:text-primary-400' : 'text-gray-800 dark:text-gray-200'"
                                x-text="(p.live_score ?? p.score_final ?? 0) + '%'"></span>
                        </div>
                      </div>

                      <!-- Bar Progres Animasi -->
                      <div class="h-2.5 bg-gray-100 dark:bg-gray-700 rounded-full overflow-hidden relative">
                        <div class="h-full transition-all duration-500 rounded-full"
                             :class="p.user_id == (user?.id || 0) ? 'bg-primary-500' : (p.disconnected ? 'bg-gray-400' : 'bg-red-500')"
                             :style="'width: ' + Math.min(100, Math.max(0, (p.live_score ?? p.score_final ?? 0))) + '%'"></div>
                      </div>
                    </div>
                  </template>
                </div>
              </div>
            </template>

            <!-- KONDISI 2: TANTANGAN SUDAH SELESAI (Completed - Menampilkan Juara) -->
            <template x-if="result.challengeData && result.challengeData.status === 'completed' && !(result.challengeData.participants || []).some(p => p.score_final === null && !p.is_submitted)">
              <div class="mt-2" x-data="{
                sortedParticipants: [...result.challengeData.participants].sort((a,b) => {
                  const scoreA = (a.score_final !== null && a.score_final !== undefined) ? Number(a.score_final) : -1;
                  const scoreB = (b.score_final !== null && b.score_final !== undefined) ? Number(b.score_final) : -1;
                  if (scoreB !== scoreA) return scoreB - scoreA;
                  const timeA = (a.time_taken !== null && a.time_taken !== undefined) ? Number(a.time_taken) : 999999;
                  const timeB = (b.time_taken !== null && b.time_taken !== undefined) ? Number(b.time_taken) : 999999;
                  return timeA - timeB;
                }),
                getRank(uid) {
                  return this.sortedParticipants.findIndex(p => p.user_id == uid) + 1;
                },
                get myRank() { return this.getRank(user.id); },
                get myData() { return this.sortedParticipants.find(p => p.user_id == user.id); }
              }">
                <div class="text-center mb-6">
                  <template x-if="myRank === 1">
                    <div><p class="text-5xl mb-2">🏆</p><p class="font-bold text-yellow-500 text-xl">Juara Pertama!</p></div>
                  </template>
                  <template x-if="myRank === 2">
                    <div><p class="text-5xl mb-2">🥈</p><p class="font-bold text-gray-400 text-xl">Juara Kedua!</p></div>
                  </template>
                  <template x-if="myRank === 3">
                    <div><p class="text-5xl mb-2">🥉</p><p class="font-bold text-amber-700 text-xl">Juara Ketiga!</p></div>
                  </template>
                  <template x-if="myRank > 3">
                    <div><p class="text-5xl mb-2">💪</p><p class="font-bold text-primary-500 text-xl">Kerja Bagus!</p></div>
                  </template>
                  <p class="text-sm text-gray-500 mt-1">Kamu menempati peringkat <strong x-text="'#' + myRank"></strong> dari <strong x-text="sortedParticipants.length"></strong> peserta.</p>
                </div>
                
                <div class="space-y-3">
                  <template x-for="(p, index) in sortedParticipants" :key="p.user_id">
                    <div class="flex items-center p-3 rounded-xl border relative overflow-hidden"
                         :class="p.user_id == user.id ? 'bg-primary-50 border-primary-200 dark:bg-primary-900/20 dark:border-primary-800' : 'bg-white dark:bg-gray-800 border-gray-100 dark:border-gray-700'">
                      
                      <!-- Peringkat -->
                      <div class="w-8 flex-shrink-0 flex items-center justify-center font-bold text-lg"
                           :class="index === 0 ? 'text-yellow-500' : (index === 1 ? 'text-gray-400' : (index === 2 ? 'text-amber-700' : 'text-gray-400 dark:text-gray-600'))">
                        <span x-show="index === 0">1</span>
                        <span x-show="index === 1">2</span>
                        <span x-show="index === 2">3</span>
                        <span x-show="index > 2" x-text="index + 1" class="text-sm"></span>
                      </div>
                      
                      <!-- Info Peserta -->
                      <div class="flex-1 ml-3 min-w-0">
                        <p class="font-bold text-gray-900 dark:text-white truncate text-sm flex items-center gap-1.5">
                          <span x-text="p.user_id == user.id ? 'Kamu (' + p.name + ')' : p.name"></span>
                          <span x-show="p.is_host" class="text-[10px] bg-amber-100 text-amber-700 dark:bg-amber-900/30 dark:text-amber-400 px-1.5 py-0.5 rounded font-bold" title="Host">👑</span>
                        </p>
                        <p class="text-xs text-gray-500" x-text="p.time_taken ? formatDuration(p.time_taken) : '-'"></p>
                      </div>
                      
                      <!-- Skor -->
                      <div class="flex-shrink-0 text-right ml-3">
                        <p class="font-extrabold text-lg"
                           :class="p.user_id == user.id ? 'text-primary-600 dark:text-primary-400' : 'text-gray-700 dark:text-gray-300'"
                           x-text="(p.score_final ?? 0) + ' pts'"></p>
                      </div>
                    </div>
                  </template>
                </div>
              </div>
            </template>
            <button @click="navigate('/challenges')" class="mt-4 w-full py-2 text-xs text-primary-600 dark:text-primary-400 hover:underline">
              Lihat semua tantangan →
            </button>
          </div>
        </template>

        <!-- Score Card -->
        <div class="card p-8 text-center mb-6">
          <div class="text-5xl mb-3" x-text="scoreGrade(result.data.score).emoji"></div>
          <h1 class="text-xl font-bold text-gray-700 dark:text-gray-200 mb-1" x-text="scoreGrade(result.data.score).label"></h1>
          <div class="text-7xl font-extrabold my-4" :class="scoreGrade(result.data.score).color"
               x-text="result.data.score + '%'"></div>
          <p class="text-gray-500 dark:text-gray-400 text-sm" x-text="result.data.quiz_title || result.data.quiz?.title"></p>
          <p class="text-xs text-gray-400 mt-1" x-text="'Dimainkan oleh: ' + (result.data.player_name || 'Kamu')"></p>

          <!-- Stats -->
          <div class="grid grid-cols-3 gap-4 mt-6">
            <div class="bg-green-50 dark:bg-green-900/20 rounded-xl p-3">
              <div class="font-bold text-lg text-green-600 dark:text-green-400" x-text="result.data.correct_count || 0"></div>
              <div class="text-xs text-gray-500 mt-0.5">Benar</div>
            </div>
            <div class="bg-red-50 dark:bg-red-900/20 rounded-xl p-3">
              <div class="font-bold text-lg text-red-500 dark:text-red-400"
                   x-text="(result.data.wrong_count ?? (result.data.total_questions - result.data.correct_count)) || 0"></div>
              <div class="text-xs text-gray-500 mt-0.5">Salah</div>
            </div>
            <div class="bg-gray-50 dark:bg-gray-800 rounded-xl p-3">
              <div class="font-bold text-lg text-gray-700 dark:text-gray-200" x-text="formatTime(result.data.time_taken||0)"></div>
              <div class="text-xs text-gray-500 mt-0.5">Waktu</div>
            </div>
          </div>

          <!-- Pass/Fail Badge (Hanya tampil jika pengerjaan berasal dari TUGAS) -->
          <div x-show="result.assignId || result.data?.is_assignment || result.data?.has_kkm"
               class="mt-5 inline-flex items-center gap-2 px-5 py-2 rounded-full text-sm font-semibold"
               :class="result.data?.passed ? 'bg-green-100 text-green-700 dark:bg-green-900/40 dark:text-green-400' : 'bg-red-100 text-red-600 dark:bg-red-900/40 dark:text-red-400'">
            <span x-text="result.data?.passed ? '✅ Lulus' : '❌ Tidak Lulus'"></span>
            <span class="text-xs opacity-70" x-text="'(Min. ' + (result.data?.passing_score||result.data?.quiz?.passing_score||60) + '%)'"></span>
          </div>
        </div>

        <!-- Answer Review -->
        <div class="card p-6 mb-6" x-show="result.data.answers && result.data.answers.length > 0">
          <div class="flex items-center justify-between mb-4">
            <h2 class="font-bold text-gray-900 dark:text-white">📋 Pembahasan Jawaban</h2>
            <span x-show="result.mode === 'instant' || result.data?.mode === 'instant'" class="text-xs text-orange-500 dark:text-orange-400 font-medium bg-orange-50 dark:bg-orange-900/20 px-2 py-1 rounded-lg">
              ⚡ Soal yang dikerjakan saja
            </span>
          </div>
          <div class="space-y-4">
            <template x-for="(a, idx) in result.data.answers" :key="a.question_id">
              <div class="border border-gray-100 dark:border-gray-800 rounded-xl p-4">
                <div class="flex items-start gap-2 mb-3">
                  <span class="text-sm font-bold text-gray-400 flex-shrink-0" x-text="(idx+1)+'.'"></span>
                  <div class="flex-1">
                    <p class="text-sm font-medium text-gray-800 dark:text-gray-200" x-text="a.question_text"></p>
                    <span class="inline-block mt-1 text-xs px-2 py-0.5 rounded-full font-semibold"
                          :class="a.is_correct ? 'bg-green-100 text-green-700 dark:bg-green-900/40 dark:text-green-400' : 'bg-red-100 text-red-600 dark:bg-red-900/40 dark:text-red-400'"
                          x-text="a.is_correct ? '✅ Benar' : (a.selected_option_id != null || a.selected_answer ? '❌ Salah' : '⏱️ Waktu Habis')"></span>
                  </div>
                </div>
                <div class="space-y-2 mt-2" x-show="a.options && a.options.length > 0">
                  <template x-for="opt in a.options" :key="opt.id">
                    <div class="flex items-center gap-2 text-sm px-3 py-2 rounded-lg"
                         :class="{
                           'bg-green-50 dark:bg-green-900/20 text-green-700 dark:text-green-400 font-medium': opt.is_correct,
                           'bg-red-50 dark:bg-red-900/20 text-red-600 dark:text-red-400': (opt.id === a.selected_option_id) && !opt.is_correct,
                           'text-gray-500 dark:text-gray-400': !opt.is_correct && (opt.id !== a.selected_option_id),
                         }">
                      <span x-text="opt.is_correct ? '✅' : (opt.id === a.selected_option_id ? '❌' : '○')"></span>
                      <span x-text="opt.option_text"></span>
                    </div>
                  </template>
                </div>
                <div x-show="!a.options || a.options.length === 0" class="mt-2 text-sm">
                  <p class="text-gray-500 dark:text-gray-400">Jawaban kamu: <span class="font-medium" x-text="a.selected_answer || '(tidak dijawab / waktu habis)'"></span></p>
                  <p class="text-green-600 dark:text-green-400">Jawaban benar: <span class="font-medium" x-text="a.correct_answer"></span></p>
                </div>
                <p x-show="a.explanation" class="mt-3 text-xs text-gray-500 dark:text-gray-400 bg-blue-50 dark:bg-blue-900/20 rounded-lg px-3 py-2 italic"
                   x-text="'💡 ' + a.explanation"></p>
              </div>
            </template>
          </div>
        </div>

        <!-- Kumpulkan ke Tugas (disembunyikan saat admin/pengajar mereview hasil orang lain) -->
        <div x-show="result.assignId && !(result.data?.user_id !== user?.id && (user?.role === 'admin' || user?.role === 'pengajar'))"
             class="card p-5 mb-4 border-2 border-primary-200 dark:border-primary-800 bg-primary-50 dark:bg-primary-900/20">
          <div class="flex items-center gap-3 mb-3">
            <span class="text-2xl">📋</span>
            <div>
              <h3 class="font-bold text-gray-900 dark:text-white text-sm">Kumpulkan ke Tugas</h3>
              <p class="text-xs text-gray-500 dark:text-gray-400">Klik tombol di bawah untuk mengumpulkan hasil quiz ini sebagai jawaban tugas.</p>
            </div>
          </div>
          <div x-show="result.assignSubmitted" class="flex items-center gap-2 text-green-600 dark:text-green-400 font-semibold text-sm">
            <span>✅</span> Tugas berhasil dikumpulkan!
          </div>
          <div x-show="result.assignError && !result.assignSubmitted" class="text-red-500 text-sm mb-2" x-text="result.assignError"></div>
          <button x-show="!result.assignSubmitted"
                  @click="submitToAssignment(result.assignId, result.data?.id)"
                  class="btn-primary w-full py-2.5 text-sm"
                  :disabled="result.assignSubmitting">
            <span x-show="result.assignSubmitting" class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin inline-block mr-2"></span>
            📤 Kumpulkan Tugas Sekarang
          </button>
        </div>

        <!-- Actions: berbeda tergantung konteks (viewer vs pemilik) -->
        <template x-if="result.data?.user_id !== user?.id && (user?.role === 'admin' || user?.role === 'pengajar')">
          <!-- Tampilan untuk admin/pengajar yang mereview hasil siswa -->
          <div class="flex flex-col sm:flex-row gap-3">
            <button @click="navigate('/public-history')"
                    class="btn-secondary flex-1 justify-center py-2.5">← Kembali ke Histori Siswa</button>
            <button @click="navigate('/quiz/' + (result.data.quiz_id||result.data.quiz?.id))"
                    class="btn-primary flex-1 justify-center py-2.5">📋 Lihat Quiz</button>
          </div>
        </template>
        <template x-if="!(result.data?.user_id !== user?.id && (user?.role === 'admin' || user?.role === 'pengajar'))">
          <!-- Tampilan normal untuk pemilik attempt -->
          <div class="flex flex-col sm:flex-row gap-3">
            <button
              @click="navigate(result.assignId ? '/play/' + (result.data.quiz_id||result.data.quiz?.id) + (result.mode ? '?mode=' + result.mode + '&assign=' + result.assignId : '?assign=' + result.assignId) : '/quiz/' + (result.data.quiz_id||result.data.quiz?.id))"
              class="btn-secondary flex-1 justify-center py-2.5">🔄 Coba Lagi</button>
            <button @click="navigate('/quizzes')" class="btn-primary flex-1 justify-center py-2.5">📝 Quiz Lain</button>
            <button @click="navigate('/leaderboard')" class="flex-1 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 text-sm font-semibold text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors">🏆 Leaderboard</button>
          </div>
        </template>

      </div>
    </template>
  </div>
</div>
