<!-- TOURNAMENT DETAIL / LOBBY & LIVE LEADERBOARD -->
<div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8 animate-fade-in"
     x-init="loadTournamentDetail(currentRoute.split('/')[2])">

  <!-- Back button -->
  <button @click="navigate('/tournaments')"
          class="inline-flex items-center gap-1.5 text-xs font-semibold text-gray-500 hover:text-primary-600 dark:hover:text-primary-400 mb-5 transition-colors">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
    <span>Kembali ke Daftar Turnamen</span>
  </button>

  <!-- Loading State -->
  <div x-show="tournament.detailLoading" class="space-y-4">
    <div class="skeleton h-44 rounded-2xl"></div>
    <div class="skeleton h-72 rounded-2xl"></div>
  </div>

  <!-- Detail Content -->
  <div x-show="!tournament.detailLoading && tournament.detail" class="space-y-6">

    <!-- HERO HEADER CARD -->
    <div class="card p-6 border-2 border-primary-200 dark:border-primary-800/60 bg-gradient-to-br from-primary-50/50 via-amber-50/30 to-white dark:from-primary-950/20 dark:via-amber-950/10 dark:to-gray-900 shadow-sm">
      <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-4 mb-4 pb-4 border-b border-primary-100 dark:border-primary-900/40">
        <div class="flex items-start gap-3">
          <div class="w-12 h-12 rounded-2xl bg-amber-100 dark:bg-amber-900/40 text-amber-700 dark:text-amber-400 flex items-center justify-center font-bold text-2xl flex-shrink-0 shadow-inner">
            🏆
          </div>
          <div>
            <div class="flex items-center gap-2 flex-wrap mb-1">
              <span class="text-xs px-2.5 py-0.5 rounded-full font-bold uppercase tracking-wider"
                    :class="{
                      'bg-blue-100 text-blue-700 dark:bg-blue-900/30 dark:text-blue-400': tournament.detail?.status === 'open',
                      'bg-amber-100 text-amber-700 dark:bg-amber-900/30 dark:text-amber-400 animate-pulse': tournament.detail?.status === 'in_progress',
                      'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/30 dark:text-emerald-400': tournament.detail?.status === 'completed',
                      'bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-400': tournament.detail?.status === 'cancelled'
                    }">
                <span x-text="tournament.detail?.status === 'open' ? '🟢 Pendaftaran / Persiapan' : (tournament.detail?.status === 'in_progress' ? '🔥 Tanding Berlangsung' : (tournament.detail?.status === 'completed' ? '✓ Turnamen Selesai' : 'Dibatalkan'))"></span>
              </span>
              <span x-show="tournament.detail?.is_creator" class="text-xs bg-amber-100 text-amber-800 dark:bg-amber-900/40 dark:text-amber-300 px-2 py-0.5 rounded-full font-bold">
                👑 Anda adalah Juri / Pengawas
              </span>
            </div>
            <h1 class="text-xl sm:text-2xl font-extrabold text-gray-900 dark:text-white" x-text="tournament.detail?.title"></h1>
            <p class="text-xs text-gray-500 dark:text-gray-400 mt-0.5" x-text="tournament.detail?.description || 'Kompetisi kuis resmi QuizB'"></p>
          </div>
        </div>

        <!-- Live status refresh button -->
        <div class="flex items-center gap-2 self-start">
          <button @click="refreshTournamentDetail()"
                  class="text-xs px-3 py-1.5 rounded-lg border border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
            <span>Live Sync</span>
            <span class="text-xs">🔄</span>
          </button>
        </div>
      </div>

      <!-- Detail Kuis & Meta -->
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-xs mb-5">
        <div class="bg-white/80 dark:bg-gray-800/80 p-3 rounded-xl border border-gray-100 dark:border-gray-700">
          <p class="text-gray-400 mb-0.5">Arena Kuis</p>
          <p class="font-bold text-gray-900 dark:text-white truncate" x-text="tournament.detail?.quiz_title"></p>
        </div>
        <div class="bg-white/80 dark:bg-gray-800/80 p-3 rounded-xl border border-gray-100 dark:border-gray-700">
          <p class="text-gray-400 mb-0.5">Juri / Penyelenggara</p>
          <p class="font-bold text-gray-900 dark:text-white truncate" x-text="tournament.detail?.creator_name"></p>
        </div>
        <div class="bg-white/80 dark:bg-gray-800/80 p-3 rounded-xl border border-gray-100 dark:border-gray-700">
          <p class="text-gray-400 mb-0.5">Total Soal</p>
          <p class="font-bold text-gray-900 dark:text-white" x-text="(tournament.detail?.total_questions || '-') + ' Soal'"></p>
        </div>
        <div class="bg-white/80 dark:bg-gray-800/80 p-3 rounded-xl border border-gray-100 dark:border-gray-700">
          <p class="text-gray-400 mb-0.5">Peserta Siap</p>
          <p class="font-bold text-gray-900 dark:text-white"
             x-text="(tournament.detail?.participants || []).filter(p => p.status === 'accepted').length + ' / ' + (tournament.detail?.participants || []).length + ' Pemain'"></p>
        </div>
      </div>

      <!-- ACTION BANNER (Berdasarkan status user & room) -->
      <div>
        <!-- PANEL A: JURI / PENYELENGGARA (Pembuat Turnamen) -->
        <template x-if="tournament.detail?.is_creator">
          <div class="space-y-3">
            <!-- Juri saat status Open (Menunggu/Memulai) -->
            <div x-show="tournament.detail?.status === 'open'"
                 x-data="{
                   get participants() {
                     return (tournament.detail?.participants || []).filter(p => p.user_id != tournament.detail?.creator_id);
                   },
                   get totalCount() {
                     return this.participants.length;
                   },
                   get acceptedCount() {
                     return this.participants.filter(p => p.status === 'accepted').length;
                   },
                   get pendingCount() {
                     return this.participants.filter(p => p.status !== 'accepted').length;
                   },
                   get allAccepted() {
                     return this.totalCount >= 2 && this.acceptedCount === this.totalCount;
                   }
                 }"
                 class="bg-primary-50 dark:bg-primary-900/30 p-4 rounded-xl border border-primary-200 dark:border-primary-800 flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
              <div class="space-y-2">
                <div class="flex flex-wrap items-center gap-2 mb-0.5">
                  <span class="text-xs px-2 py-0.5 rounded-full bg-primary-100 dark:bg-primary-800 text-primary-800 dark:text-primary-200 font-bold">👑 Panel Juri / Pengawas</span>
                  
                  <!-- Status Badge Kesiapan Peserta -->
                  <template x-if="allAccepted">
                    <span class="text-xs px-2.5 py-0.5 rounded-full bg-emerald-100 dark:bg-emerald-900/60 text-emerald-800 dark:text-emerald-200 font-bold flex items-center gap-1 shadow-sm">
                      <span>✅</span>
                      <span>Semua Peserta Siap (<span x-text="acceptedCount + '/' + totalCount"></span>)</span>
                    </span>
                  </template>
                  <template x-if="!allAccepted">
                    <span class="text-xs px-2.5 py-0.5 rounded-full bg-amber-100 dark:bg-amber-900/60 text-amber-800 dark:text-amber-200 font-bold flex items-center gap-1.5 shadow-sm">
                      <span class="w-2 h-2 rounded-full bg-amber-500 animate-ping"></span>
                      <span>Menunggu Konfirmasi (<span x-text="acceptedCount + '/' + totalCount"></span> Siap)</span>
                    </span>
                  </template>
                </div>

                <p class="font-bold text-xs text-primary-900 dark:text-primary-200" x-show="allAccepted">
                  Lobby Turnamen Lengkap & Siap Dimulai! 🚀
                </p>
                <p class="font-bold text-xs text-primary-900 dark:text-primary-200" x-show="!allAccepted">
                  Menunggu Peserta Menerima Undangan
                </p>

                <p class="text-[11px] text-primary-700 dark:text-primary-400" x-show="allAccepted">
                  Seluruh peserta turnamen telah menerima undangan dan siap di lobby. Klik tombol <strong>Mulai Turnamen Sekarang</strong> untuk memulai jalannya kuis!
                </p>
                <p class="text-[11px] text-primary-700 dark:text-primary-400" x-show="!allAccepted">
                  Tombol mulai akan <strong>otomatis muncul setelah semua anggota menerima undangan (accept)</strong>. Tekan tombol <strong>Undang Ulang</strong> untuk mengirim notifikasi pengingat ke peserta yang belum menerima.
                </p>
                
                <!-- Menu Pengatur Jumlah Soal Saat Memulai Turnamen -->
                <div class="pt-1 flex flex-wrap items-center gap-2">
                  <label class="text-xs font-bold text-primary-900 dark:text-primary-200 whitespace-nowrap">🎯 Jumlah Soal:</label>
                  <select x-model.number="tournament.startQuestionCount"
                          class="form-input text-xs py-1.5 px-3 rounded-lg border-primary-300 dark:border-primary-700 bg-white dark:bg-gray-800 font-semibold shadow-sm w-auto">
                    <option value="10">10 Soal (Default Turnamen)</option>
                    <option value="5">5 Soal (Cepat)</option>
                    <option value="15">15 Soal</option>
                    <option value="20">20 Soal</option>
                    <option value="25">25 Soal</option>
                    <option value="50">50 Soal</option>
                    <option value="0">Semua Soal</option>
                  </select>
                  <span class="text-[11px] text-primary-600 dark:text-primary-400">(Mengalahkan setelan pribadi user)</span>
                </div>
              </div>

              <!-- Tombol Aksi Juri -->
              <div class="flex flex-wrap items-center gap-2 w-full md:w-auto justify-end">
                <!-- Tombol Undang Ulang -->
                <button @click="reinviteTournament(tournament.detail.id)"
                        class="btn-secondary text-xs py-2.5 px-4 font-bold rounded-xl border border-primary-300 dark:border-primary-700 hover:bg-primary-100 dark:hover:bg-primary-900/40 flex items-center gap-1.5 whitespace-nowrap shadow-sm"
                        title="Kirim ulang notifikasi undangan ke peserta yang belum menerima">
                  <span>🔔</span>
                  <span>Undang Ulang</span>
                  <span x-show="pendingCount > 0" class="text-[10px] px-1.5 py-0.2 rounded-full bg-amber-500 text-white font-extrabold" x-text="pendingCount"></span>
                </button>

                <!-- Tombol Mulai Turnamen: HANYA MUNCUL KETIKA SEMUA ANGGOTA SUDAH ACCEPT -->
                <button x-show="allAccepted"
                        @click="startTournament(tournament.detail.id, tournament.startQuestionCount)"
                        class="btn-primary w-full md:w-auto text-xs py-2.5 px-6 font-extrabold rounded-xl shadow-md whitespace-nowrap transition-all duration-300 hover:scale-105">
                  🚀 Mulai Turnamen Sekarang!
                </button>

                <button @click="deleteTournament(tournament.detail.id)"
                        class="btn-secondary text-xs py-2.5 px-3 rounded-xl text-red-600 dark:text-red-400 font-semibold"
                        title="Hapus Turnamen">
                  🗑 Hapus
                </button>
              </div>
            </div>

            <!-- Juri saat status In Progress (Sedang Memantau Live) -->
            <div x-show="tournament.detail?.status === 'in_progress'"
                 class="bg-amber-50 dark:bg-amber-900/20 p-4 rounded-xl border border-amber-200 dark:border-amber-800 flex flex-col sm:flex-row items-center justify-between gap-3">
              <div class="flex items-center gap-3">
                <span class="text-2xl animate-pulse">👑</span>
                <div>
                  <p class="font-bold text-xs text-amber-900 dark:text-amber-200">Mode Juri / Pengawas: Turnamen Sedang Berlangsung 🔥</p>
                  <p class="text-[11px] text-amber-700 dark:text-amber-300">
                    Anda bertindak sebagai juri/pengawas dan tidak bertanding. Pantau skor dan progres pengerjaan seluruh peserta secara langsung pada tabel klasemen di bawah.
                  </p>
                </div>
              </div>
              <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                <button @click="stopTournament(tournament.detail.id)"
                        class="py-2 px-4 text-xs font-bold rounded-xl border border-amber-400 bg-amber-100 hover:bg-amber-200 dark:bg-amber-900/50 text-amber-900 dark:text-amber-200 transition-colors flex items-center gap-1.5 whitespace-nowrap">
                  <span>⏹</span>
                  <span>Hentikan Turnamen (Stop)</span>
                </button>
                <button @click="deleteTournament(tournament.detail.id)"
                        class="py-2 px-3 text-xs font-semibold rounded-xl border border-red-300 bg-red-50 hover:bg-red-100 dark:bg-red-900/30 text-red-600 dark:text-red-400 transition-colors"
                        title="Hapus Turnamen">
                  🗑 Hapus
                </button>
              </div>
            </div>

            <!-- Juri saat status Completed -->
            <div x-show="tournament.detail?.status === 'completed'"
                 class="bg-emerald-50 dark:bg-emerald-900/20 p-4 rounded-xl border border-emerald-200 dark:border-emerald-800 flex flex-col sm:flex-row items-center justify-between gap-3">
              <div class="flex items-center gap-3">
                <span class="text-2xl">🏆</span>
                <div>
                  <p class="font-bold text-xs text-emerald-900 dark:text-emerald-200">Turnamen Telah Selesai!</p>
                  <p class="text-[11px] text-emerald-700 dark:text-emerald-400">Seluruh peserta yang bertanding telah menyelesaikan kuis. Peringkat juara telah ditetapkan pada papan klasemen.</p>
                </div>
              </div>
              <button @click="deleteTournament(tournament.detail.id)"
                      class="btn-secondary text-xs py-2 px-3 rounded-xl text-red-600 dark:text-red-400 font-semibold self-end sm:self-center"
                      title="Hapus Turnamen">
                🗑 Hapus
              </button>
            </div>
          </div>
        </template>

        <!-- PANEL B: PESERTA YANG DIUNDANG (BUKAN JURI) -->
        <template x-if="!tournament.detail?.is_creator">
          <div>
            <!-- Kasus B1: User masih pending (Belum terima/tolak undangan) -->
            <template x-if="tournament.detail?.my_status === 'pending'">
              <div class="bg-amber-100/70 dark:bg-amber-900/40 p-4 rounded-xl border border-amber-300 dark:border-amber-700 flex flex-col sm:flex-row items-center justify-between gap-3">
                <div class="flex items-center gap-2.5">
                  <span class="text-2xl">📬</span>
                  <div>
                    <p class="font-bold text-xs text-amber-900 dark:text-amber-200">Kamu diundang ke turnamen ini!</p>
                    <p class="text-[11px] text-amber-700 dark:text-amber-300">Terima undangan untuk ikut bertanding merebut juara bersama peserta lain.</p>
                  </div>
                </div>
                <div class="flex items-center gap-2 w-full sm:w-auto">
                  <button @click="acceptTournament(tournament.detail.id)" class="btn-primary flex-1 sm:flex-none text-xs py-2 px-4 font-bold rounded-xl">
                    🏆 Terima & Ikut
                  </button>
                  <button @click="declineTournament(tournament.detail.id)" class="btn-secondary flex-1 sm:flex-none text-xs py-2 px-4 rounded-xl text-red-600">
                    Tolak
                  </button>
                </div>
              </div>
            </template>

            <!-- Kasus B2: Peserta sudah accepted tapi turnamen masih open (Menunggu Juri Memulai) -->
            <template x-if="tournament.detail?.my_status === 'accepted' && tournament.detail?.status === 'open'">
              <div class="bg-blue-50 dark:bg-blue-900/20 p-4 rounded-xl border border-blue-200 dark:border-blue-800 flex items-center gap-3">
                <span class="text-2xl animate-bounce">⏳</span>
                <div>
                  <p class="font-bold text-xs text-blue-900 dark:text-blue-200">Kamu Telah Siap di Lobby Turnamen!</p>
                  <p class="text-[11px] text-blue-700 dark:text-blue-300">
                    Menunggu Juri (<span class="font-semibold" x-text="tournament.detail.creator_name"></span>) memulai pertandingan. <strong>Begitu Juri klik mulai, kuis akan otomatis dimulai di layar Anda.</strong>
                  </p>
                </div>
              </div>
            </template>

            <!-- Kasus B3: Turnamen Sedang Berlangsung & Peserta belum submit -->
            <template x-if="tournament.detail?.my_status === 'accepted' && tournament.detail?.status === 'in_progress' && !tournament.detail?.my_participant?.is_submitted && !sessionStorage.getItem('tournament_submitted_' + tournament.detail?.id)">
              <div class="bg-gradient-to-r from-emerald-500 to-teal-600 text-white p-4 rounded-xl shadow-lg flex items-center justify-between gap-3">
                <div class="flex items-center gap-3">
                  <span class="text-3xl">🚀</span>
                  <div>
                    <p class="font-extrabold text-sm">Turnamen Sedang Berlangsung!</p>
                    <p class="text-xs text-emerald-100">Kuis telah dimulai oleh Juri. Silakan mulai kerjakan kuis.</p>
                  </div>
                </div>
                <button @click="navigate('/play/' + tournament.detail.quiz_id + '?mode=tournament&tid=' + tournament.detail.id)"
                        class="bg-white text-emerald-700 hover:bg-emerald-50 font-bold text-xs py-2 px-4 rounded-xl shadow whitespace-nowrap">
                  ▶ Masuk Kuis
                </button>
              </div>
            </template>

            <!-- Kasus B4: Peserta sudah selesai mengerjakan kuis -->
            <template x-if="tournament.detail?.my_participant?.is_submitted || sessionStorage.getItem('tournament_submitted_' + tournament.detail?.id)">
              <div class="bg-emerald-50 dark:bg-emerald-900/20 p-4 rounded-xl border border-emerald-200 dark:border-emerald-800 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 text-xs">
                <div class="flex items-center gap-2.5">
                  <span class="text-2xl">✅</span>
                  <div>
                    <p class="font-bold text-emerald-900 dark:text-emerald-200">Kamu telah menyelesaikan kuis turnamen!</p>
                    <p class="text-emerald-700 dark:text-emerald-400 text-[11px]">
                      Skor: <strong x-text="(tournament.detail?.my_participant?.score_final !== null && tournament.detail?.my_participant?.score_final !== undefined) ? tournament.detail.my_participant.score_final + '%' : 'Tersimpan'"></strong> • Waktu: <strong x-text="formatDuration(tournament.detail?.my_participant?.time_taken || 0)"></strong>. Pantau posisi juaramu di bawah.
                    </p>
                  </div>
                </div>
                <template x-if="tournament.detail?.my_participant?.attempt_id">
                  <button @click="navigate('/result/' + tournament.detail.my_participant.attempt_id + '?mode=tournament&tid=' + tournament.detail.id)"
                          class="py-2 px-3.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs whitespace-nowrap shadow transition-transform hover:scale-105">
                    📄 Pembahasan & Skor Detail →
                  </button>
                </template>
              </div>
            </template>
          </div>
        </template>
      </div>

    </div>

    <!-- LIVE LEADERBOARD & KLASEMEN PESERTA -->
    <div class="card p-6"
         x-data="{
           get sortedParticipants() {
             return [...(tournament.detail?.participants || [])]
               .filter(p => p.status === 'accepted')
               .sort((a,b) => {
                 const scoreA = (a.score_final !== null && a.score_final !== undefined) ? Number(a.score_final) : (a.live_score ?? -1);
                 const scoreB = (b.score_final !== null && b.score_final !== undefined) ? Number(b.score_final) : (b.live_score ?? -1);
                 if (scoreB !== scoreA) return scoreB - scoreA;
                 const timeA = (a.time_taken !== null && a.time_taken !== undefined) ? Number(a.time_taken) : 999999;
                 const timeB = (b.time_taken !== null && b.time_taken !== undefined) ? Number(b.time_taken) : 999999;
                 return timeA - timeB;
               });
           },
           get pendingParticipants() {
             return [...(tournament.detail?.participants || [])].filter(p => p.status === 'pending');
           },
           get declinedParticipants() {
             return [...(tournament.detail?.participants || [])].filter(p => p.status === 'declined');
           }
         }">

      <div class="flex items-center justify-between mb-6 pb-3 border-b border-gray-100 dark:border-gray-800">
        <div>
          <h2 class="text-base sm:text-lg font-bold text-gray-900 dark:text-white flex items-center gap-2">
            <span>📊</span>
            <span>Klasemen & Peringkat Turnamen</span>
          </h2>
          <p class="text-xs text-gray-500 dark:text-gray-400">Peringkat ditentukan berdasarkan Skor Tertinggi lalu Waktu Tercepat</p>
        </div>
        <span class="text-xs bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 font-bold px-2.5 py-1 rounded-full"
              x-text="sortedParticipants.length + ' Peserta Aktif'"></span>
      </div>

      <!-- Podium Top 3 (Jika turnamen sudah selesai atau ada pemain yang selesai) -->
      <template x-if="sortedParticipants.some(p => p.is_submitted) && tournament.detail?.status === 'completed'">
        <div class="mb-8 p-4 bg-gradient-to-b from-amber-500/10 via-amber-500/5 to-transparent rounded-2xl border border-amber-200 dark:border-amber-800/50 text-center">
          <p class="text-xs font-bold uppercase tracking-wider text-amber-700 dark:text-amber-400 mb-1">👑 Sang Juara Turnamen</p>
          <p class="text-2xl font-black text-gray-900 dark:text-white" x-text="sortedParticipants[0]?.name"></p>
          <p class="text-xs text-gray-500 mt-1">
            Skor Akhir: <strong class="text-primary-600" x-text="sortedParticipants[0]?.score_final + '%'"></strong> • Waktu: <strong x-text="(sortedParticipants[0]?.time_taken >= 999999 ? 'Waktu habis' : formatDuration(sortedParticipants[0]?.time_taken || 0))"></strong>
          </p>
        </div>
      </template>

      <!-- Peserta Aktif List (Leaderboard) -->
      <div class="space-y-3 mb-6">
        <template x-for="(p, index) in sortedParticipants" :key="p.user_id">
          <div class="p-3.5 rounded-xl border relative overflow-hidden transition-all"
               :class="p.user_id == user?.id
                 ? 'bg-primary-50/70 border-primary-200 dark:bg-primary-950/30 dark:border-primary-800 shadow-sm'
                 : 'bg-white dark:bg-gray-800 border-gray-100 dark:border-gray-700'">
            
            <div class="flex items-center justify-between gap-3 text-xs mb-1.5">
              <!-- Rank & Info Nama -->
              <div class="flex items-center gap-3 min-w-0">
                <!-- Rank Medal / Number -->
                <div class="w-7 h-7 rounded-lg flex items-center justify-center font-extrabold text-sm flex-shrink-0"
                     :class="{
                       'bg-amber-100 text-amber-700 dark:bg-amber-900/50 dark:text-amber-300': index === 0,
                       'bg-gray-200 text-gray-700 dark:bg-gray-700 dark:text-gray-300': index === 1,
                       'bg-amber-800/15 text-amber-900 dark:bg-amber-900/30 dark:text-amber-400': index === 2,
                       'bg-gray-100 text-gray-500 dark:bg-gray-800 dark:text-gray-400': index > 2
                     }">
                  <span x-text="index === 0 ? '🥇' : (index === 1 ? '🥈' : (index === 2 ? '🥉' : '#' + (index + 1)))"></span>
                </div>

                <div class="min-w-0">
                  <p class="font-bold text-gray-900 dark:text-white truncate flex items-center gap-1.5">
                    <span x-text="p.user_id == user?.id ? 'Kamu (' + p.name + ')' : p.name"></span>
                    <span x-show="p.is_creator" class="text-[10px] bg-amber-100 text-amber-700 dark:bg-amber-900/40 dark:text-amber-400 px-1.5 py-0.2 rounded font-bold" title="Host">👑 Host</span>
                    <span x-show="p.disconnected" class="text-red-500 text-[11px]" title="Terputus">⚠️ Terputus</span>
                  </p>
                  <p class="text-[11px] text-gray-400" x-text="p.time_taken ? (p.time_taken >= 999999 ? 'Waktu habis (terputus)' : 'Durasi: ' + formatDuration(p.time_taken)) : (p.is_submitted ? 'Selesai' : 'Sedang bertanding')"></p>
                </div>
              </div>

              <!-- Skor & Status Badge -->
              <div class="flex items-center gap-2.5 flex-shrink-0">
                <span class="text-[10px] px-2 py-0.5 rounded-full font-semibold"
                      :class="p.is_submitted
                        ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/30 dark:text-emerald-400'
                        : 'bg-blue-100 text-blue-700 dark:bg-blue-900/30 dark:text-blue-400'">
                  <span x-text="p.is_submitted ? '✓ Selesai' : 'Sedang Menjawab'"></span>
                </span>
                <span class="font-black text-base w-14 text-right"
                      :class="p.user_id == user?.id ? 'text-primary-600 dark:text-primary-400' : 'text-gray-900 dark:text-white'"
                      x-text="(p.score_final ?? p.live_score ?? 0) + '%'"></span>
              </div>
            </div>

            <!-- Bilah Progres Animasi -->
            <div class="h-2 bg-gray-100 dark:bg-gray-700 rounded-full overflow-hidden relative">
              <div class="h-full transition-all duration-500 rounded-full"
                   :class="p.user_id == user?.id ? 'bg-primary-500' : (p.disconnected ? 'bg-gray-400' : 'bg-amber-500')"
                   :style="'width: ' + Math.min(100, Math.max(0, (p.score_final ?? p.live_score ?? 0))) + '%'"></div>
            </div>
          </div>
        </template>
      </div>

      <!-- Undangan Lainnya (Pending & Declined) -->
      <div class="pt-4 border-t border-gray-100 dark:border-gray-800 space-y-3" x-show="pendingParticipants.length > 0 || declinedParticipants.length > 0">
        <!-- Pending -->
        <div x-show="pendingParticipants.length > 0">
          <p class="text-xs font-semibold text-gray-500 mb-2">⏳ Menunggu Konfirmasi Undangan (<span x-text="pendingParticipants.length"></span> orang):</p>
          <div class="flex flex-wrap gap-2">
            <template x-for="p in pendingParticipants" :key="p.user_id">
              <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-gray-100 dark:bg-gray-800 text-xs text-gray-600 dark:text-gray-400 border border-gray-200 dark:border-gray-700">
                <span class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span>
                <span x-text="p.name"></span>
                <button x-show="tournament.detail?.is_creator && tournament.detail?.status === 'open'"
                        @click="reinviteTournament(tournament.detail.id, p.user_id)"
                        class="text-[10px] text-primary-600 dark:text-primary-400 hover:underline font-semibold ml-1 cursor-pointer"
                        title="Kirim ulang undangan ke pemain ini">
                  (Undang Ulang)
                </button>
              </span>
            </template>
          </div>
        </div>

        <!-- Declined -->
        <div x-show="declinedParticipants.length > 0" class="pt-2">
          <p class="text-xs font-semibold text-gray-400 mb-1.5">✗ Menolak Undangan (<span x-text="declinedParticipants.length"></span> orang):</p>
          <div class="flex flex-wrap gap-1.5">
            <template x-for="p in declinedParticipants" :key="p.user_id">
              <span class="text-xs text-gray-400 line-through px-2 py-0.5" x-text="p.name"></span>
            </template>
          </div>
        </div>
      </div>

    </div>

  </div>

</div>
