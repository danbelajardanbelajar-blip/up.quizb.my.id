<!-- ASSIGNMENT RESULTS PAGE -->
<div x-show="currentRoute.startsWith('/assignment/') && routeParams[1] === 'results'"
     class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-10">

  <div class="flex items-center gap-3 mb-6">
    <button @click="navigate('/classroom/' + (assignmentView.assignment?.class_id || ''))"
            class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-500 transition-colors">
      ← Kembali
    </button>
    <div>
      <h1 class="text-xl font-bold text-gray-900 dark:text-white">📊 Hasil Tugas</h1>
      <p class="text-sm text-gray-500 dark:text-gray-400"
         x-text="assignmentView.assignment?.title || '...'"></p>
    </div>
  </div>

  <!-- Loading -->
  <div x-show="assignmentView.loading" class="space-y-4">
    <div class="skeleton h-24 rounded-2xl"></div>
    <div class="skeleton h-64 rounded-2xl"></div>
  </div>

  <div x-show="!assignmentView.loading && assignmentView.results">

    <!-- Stats -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-8">
      <div class="card p-4 text-center">
        <p class="text-2xl font-bold text-gray-900 dark:text-white"
           x-text="assignmentView.results ? assignmentView.results.total_members : 0"></p>
        <p class="text-xs text-gray-400 mt-1">Total Siswa</p>
      </div>
      <div class="card p-4 text-center">
        <p class="text-2xl font-bold text-green-600 dark:text-green-400"
           x-text="assignmentView.results ? assignmentView.results.submitted : 0"></p>
        <p class="text-xs text-gray-400 mt-1">Sudah Kumpul</p>
      </div>
      <div class="card p-4 text-center">
        <p class="text-2xl font-bold text-yellow-500"
           x-text="assignmentView.results ? assignmentView.results.not_submitted : 0"></p>
        <p class="text-xs text-gray-400 mt-1">Belum Kumpul</p>
      </div>
      <div class="card p-4 text-center">
        <p class="text-2xl font-bold text-primary-600 dark:text-primary-400"
           x-text="assignmentView.results ? (assignmentView.results.avg_score || '—') : '—'"></p>
        <p class="text-xs text-gray-400 mt-1">Rata-rata Skor</p>
      </div>
    </div>

    <!-- Progress bar -->
    <div class="card p-5 mb-6">
      <div class="flex items-center justify-between text-sm mb-2">
        <span class="font-medium text-gray-700 dark:text-gray-300">Progress Pengumpulan</span>
        <span class="text-gray-500"
              x-text="assignmentView.results ? (assignmentView.results.submitted + ' / ' + assignmentView.results.total_members) : '0 / 0'"></span>
      </div>
      <div class="h-3 bg-gray-200 dark:bg-gray-700 rounded-full overflow-hidden">
        <div class="h-full bg-green-500 rounded-full transition-all duration-500"
             :style="'width:' + (assignmentView.results && assignmentView.results.total_members > 0 ? Math.round((assignmentView.results.submitted / assignmentView.results.total_members) * 100) : 0) + '%'">
        </div>
      </div>
    </div>

    <!-- Header row -->
    <div class="flex items-center justify-between mb-4 flex-wrap gap-3">
      <div class="flex items-center gap-3 flex-wrap">
        <h2 class="text-base font-semibold text-gray-700 dark:text-gray-300">👥 Daftar Siswa</h2>
        <!-- Quick sort dropdown for mobile -->
        <div class="md:hidden flex items-center gap-1.5 text-xs text-gray-500">
          <span>Urut:</span>
          <select @change="sortAssignmentResults($event.target.value)"
                  class="form-input py-1 px-2 text-xs rounded-lg border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300">
            <option value="rank" :selected="assignmentView.sort.key === 'rank'">Peringkat (#)</option>
            <option value="student_name" :selected="assignmentView.sort.key === 'student_name'">Nama Siswa</option>
            <option value="score" :selected="assignmentView.sort.key === 'score'">Skor Tertinggi</option>
            <option value="correct_count" :selected="assignmentView.sort.key === 'correct_count'">Jumlah Benar</option>
            <option value="time_taken" :selected="assignmentView.sort.key === 'time_taken'">Waktu Tercepat</option>
            <option value="submitted_at" :selected="assignmentView.sort.key === 'submitted_at'">Waktu Kumpul</option>
          </select>
        </div>
      </div>
      <div class="flex items-center gap-2 flex-wrap">
        <button @click="loadAssignmentResults(routeParams[0])" class="btn-secondary text-sm px-4 py-2 flex items-center gap-2" :disabled="assignmentView.loading">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" :class="{'animate-spin': assignmentView.loading}">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
          Refresh
        </button>
        <button @click="exportResultsToExcel()"
                class="btn-secondary text-sm px-4 py-2 flex items-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
          </svg>
          Export Excel
        </button>
        <button @click="navigate('/assignment/' + routeParams[0] + '/monitor')"
                class="btn-secondary text-sm px-4 py-2 flex items-center gap-2">
          🔴 Pantau Live
        </button>
      </div>
    </div>

    <!-- Table Container -->
    <div class="card overflow-hidden">
      <!-- MOBILE VIEW: Cards list (visible on screens < 768px, no horizontal scroll needed) -->
      <div class="md:hidden divide-y divide-gray-100 dark:divide-gray-800">
        <template x-for="(s, idx) in sortedAssignmentSubmissions()" :key="s.user_id">
          <div class="p-3.5 hover:bg-gray-50/60 dark:hover:bg-gray-800/40 transition-colors">
            <!-- Top row: Rank, Avatar, Name & Score badge -->
            <div class="flex items-start justify-between gap-2.5">
              <div class="flex items-start gap-2.5 min-w-0 flex-1">
                <!-- Rank -->
                <div class="w-6 text-center flex-shrink-0 pt-0.5">
                  <span x-show="s.rank === 1" class="text-base" title="Peringkat 1">🥇</span>
                  <span x-show="s.rank === 2" class="text-base" title="Peringkat 2">🥈</span>
                  <span x-show="s.rank === 3" class="text-base" title="Peringkat 3">🥉</span>
                  <span x-show="s.rank > 3" class="text-xs font-bold text-gray-400" x-text="s.rank"></span>
                  <span x-show="!s.rank" class="text-gray-300 dark:text-gray-600 text-xs">—</span>
                </div>
                <!-- Avatar -->
                <span class="w-8 h-8 rounded-full bg-primary-100 dark:bg-primary-900/40 text-primary-600 dark:text-primary-400 flex items-center justify-center text-xs font-bold flex-shrink-0"
                      x-text="s.student_name.charAt(0).toUpperCase()"></span>
                <!-- Student Name & Chat button -->
                <div class="min-w-0 flex-1">
                  <button @click.stop="navigate('/assignment/' + routeParams[0] + '/history/' + s.user_id)"
                          :title="s.student_name"
                          class="font-semibold text-xs text-gray-900 dark:text-gray-100 hover:text-primary-600 dark:hover:text-primary-400 hover:underline transition-colors text-left line-clamp-2 block leading-snug">
                    <span x-text="s.student_name"></span>
                  </button>
                  <template x-if="user && user.id !== s.user_id">
                    <button @click.stop="startNewChat({ id: s.user_id, name: s.student_name }); navigate('/messages')"
                            class="inline-flex items-center gap-1 text-[10px] px-1.5 py-0.5 rounded-md bg-primary-50 dark:bg-primary-900/20 text-primary-600 dark:text-primary-400 hover:bg-primary-100 dark:hover:bg-primary-800/40 transition-colors w-fit mt-1">
                      <svg class="w-2.5 h-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
                      Kirim Pesan
                    </button>
                  </template>
                </div>
              </div>

              <!-- Score Badge on Mobile -->
              <div class="flex-shrink-0 text-right">
                <template x-if="s.submitted_at">
                  <button @click.stop="navigate('/result/' + s.attempt_id)"
                          title="Klik untuk melihat detail jawaban"
                          class="inline-flex flex-col items-center justify-center px-2.5 py-1 rounded-lg font-bold transition-all shadow-xs"
                          :class="s.score >= 75 ? 'bg-green-100 text-green-700 dark:bg-green-900/40 dark:text-green-400' : s.score >= 60 ? 'bg-yellow-100 text-yellow-700 dark:bg-yellow-900/40 dark:text-yellow-400' : 'bg-red-100 text-red-600 dark:bg-red-900/40 dark:text-red-400'">
                    <span class="text-xs font-black" x-text="s.score"></span>
                    <span class="text-[9px] font-medium opacity-75">Skor</span>
                  </button>
                </template>
                <template x-if="!s.submitted_at">
                  <span class="inline-flex items-center px-2 py-1 rounded-md text-[11px] font-medium bg-yellow-50 text-yellow-700 dark:bg-yellow-900/30 dark:text-yellow-400 border border-yellow-200/50 dark:border-yellow-800/50">
                    Belum
                  </span>
                </template>
              </div>
            </div>

            <!-- Bottom row: Benar, Waktu, Tanggal & Snapshots -->
            <div class="mt-2.5 pt-2 border-t border-gray-100/70 dark:border-gray-800/60 flex flex-wrap items-center justify-between gap-x-3 gap-y-1 text-[11px] text-gray-500 dark:text-gray-400">
              <div class="flex items-center gap-3">
                <span class="inline-flex items-center gap-1 font-medium text-gray-700 dark:text-gray-300">
                  <span class="text-green-500">✓</span>
                  <span x-text="s.submitted_at && s.correct_count !== null ? s.correct_count + ' benar' : '—'"></span>
                </span>
                <span class="inline-flex items-center gap-1">
                  <span>⏱️</span>
                  <span x-text="s.time_taken ? (Math.floor(s.time_taken/60) + 'm ' + (s.time_taken % 60) + 's') : '—'"></span>
                </span>
              </div>
              <div class="flex items-center gap-2">
                <span x-show="s.submitted_at" x-text="formatDateTime(s.submitted_at)"></span>
                <template x-if="s.has_snapshots">
                  <button @click.stop="viewAssignmentSnapshots(s.attempt_id, routeParams[0])" 
                          class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded bg-primary-50 dark:bg-primary-900/20 text-primary-600 dark:text-primary-400 text-[10px] font-semibold hover:bg-primary-100">
                    📷 Snapshots
                  </button>
                </template>
              </div>
            </div>
          </div>
        </template>
      </div>

      <!-- DESKTOP VIEW: Table (hidden on mobile, visible on >= md) -->
      <div class="hidden md:block overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="bg-gray-50 dark:bg-gray-800/60">
            <tr>
              <th @click="sortAssignmentResults('rank')"
                  class="text-center px-3 py-3 font-semibold text-gray-600 dark:text-gray-400 w-14 whitespace-nowrap cursor-pointer select-none hover:bg-gray-100 dark:hover:bg-gray-700/60 transition-colors"
                  title="Urutkan berdasarkan peringkat">
                <span>#</span>
                <span class="text-xs ml-0.5" :class="assignmentView.sort.key === 'rank' ? 'text-primary-600 dark:text-primary-400 font-bold' : 'text-gray-400'" x-text="sortIconResults('rank')"></span>
              </th>

              <th @click="sortAssignmentResults('student_name')"
                  class="text-left px-4 py-3 font-semibold text-gray-600 dark:text-gray-400 cursor-pointer select-none hover:bg-gray-100 dark:hover:bg-gray-700/60 transition-colors"
                  title="Urutkan berdasarkan nama siswa">
                <span>Nama Siswa</span>
                <span class="text-xs ml-1" :class="assignmentView.sort.key === 'student_name' ? 'text-primary-600 dark:text-primary-400 font-bold' : 'text-gray-400'" x-text="sortIconResults('student_name')"></span>
              </th>

              <th @click="sortAssignmentResults('score')"
                  class="text-center px-3 py-3 font-semibold text-gray-600 dark:text-gray-400 w-24 whitespace-nowrap cursor-pointer select-none hover:bg-gray-100 dark:hover:bg-gray-700/60 transition-colors"
                  title="Urutkan berdasarkan perolehan skor">
                <span>Skor</span>
                <span class="text-xs ml-1" :class="assignmentView.sort.key === 'score' ? 'text-primary-600 dark:text-primary-400 font-bold' : 'text-gray-400'" x-text="sortIconResults('score')"></span>
              </th>

              <th @click="sortAssignmentResults('correct_count')"
                  class="text-center px-3 py-3 font-semibold text-gray-600 dark:text-gray-400 w-24 whitespace-nowrap cursor-pointer select-none hover:bg-gray-100 dark:hover:bg-gray-700/60 transition-colors"
                  title="Urutkan berdasarkan jumlah benar">
                <span>Benar</span>
                <span class="text-xs ml-1" :class="assignmentView.sort.key === 'correct_count' ? 'text-primary-600 dark:text-primary-400 font-bold' : 'text-gray-400'" x-text="sortIconResults('correct_count')"></span>
              </th>

              <th @click="sortAssignmentResults('time_taken')"
                  class="text-center px-3 py-3 font-semibold text-gray-600 dark:text-gray-400 w-28 whitespace-nowrap cursor-pointer select-none hover:bg-gray-100 dark:hover:bg-gray-700/60 transition-colors"
                  title="Urutkan berdasarkan lama waktu pengerjaan">
                <span>Waktu</span>
                <span class="text-xs ml-1" :class="assignmentView.sort.key === 'time_taken' ? 'text-primary-600 dark:text-primary-400 font-bold' : 'text-gray-400'" x-text="sortIconResults('time_taken')"></span>
              </th>

              <th @click="sortAssignmentResults('submitted_at')"
                  class="text-center px-4 py-3 font-semibold text-gray-600 dark:text-gray-400 w-40 whitespace-nowrap cursor-pointer select-none hover:bg-gray-100 dark:hover:bg-gray-700/60 transition-colors"
                  title="Urutkan berdasarkan tanggal & waktu pengumpulan">
                <span>Status</span>
                <span class="text-xs ml-1" :class="assignmentView.sort.key === 'submitted_at' ? 'text-primary-600 dark:text-primary-400 font-bold' : 'text-gray-400'" x-text="sortIconResults('submitted_at')"></span>
              </th>
            </tr>
          </thead>
          <tbody>
            <template x-for="(s, idx) in sortedAssignmentSubmissions()" :key="s.user_id">
              <tr class="border-t border-gray-100 dark:border-gray-800 hover:bg-gray-50 dark:hover:bg-gray-800/40">
                <td class="px-3 py-3 text-center whitespace-nowrap">
                  <span x-show="s.rank === 1" class="text-lg" title="Peringkat 1">🥇</span>
                  <span x-show="s.rank === 2" class="text-lg" title="Peringkat 2">🥈</span>
                  <span x-show="s.rank === 3" class="text-lg" title="Peringkat 3">🥉</span>
                  <span x-show="s.rank > 3" class="text-gray-400 text-xs font-medium" x-text="s.rank"></span>
                  <span x-show="!s.rank" class="text-gray-300 dark:text-gray-600 text-xs">—</span>
                </td>
                <td class="px-4 py-3">
                  <div class="flex items-center gap-2">
                    <span class="w-7 h-7 rounded-full bg-primary-100 dark:bg-primary-900/40 text-primary-600 dark:text-primary-400 flex items-center justify-center text-xs font-bold flex-shrink-0"
                          x-text="s.student_name.charAt(0).toUpperCase()"></span>
                    <div class="flex flex-col min-w-0">
                      <button @click.stop="navigate('/assignment/' + routeParams[0] + '/history/' + s.user_id)"
                              :title="s.student_name"
                              class="font-medium text-gray-800 dark:text-gray-200 hover:text-primary-600 dark:hover:text-primary-400 hover:underline transition-colors text-left truncate block">
                        <span x-text="s.student_name"></span>
                      </button>
                      <template x-if="user && user.id !== s.user_id">
                        <button @click.stop="startNewChat({ id: s.user_id, name: s.student_name }); navigate('/messages')"
                                class="inline-flex items-center gap-0.5 text-[10px] px-1.5 py-0.5 rounded-md bg-primary-50 dark:bg-primary-900/20 text-primary-600 dark:text-primary-400 hover:bg-primary-100 dark:hover:bg-primary-800/40 transition-colors w-fit mt-0.5">
                          <svg class="w-2.5 h-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
                          Kirim Pesan
                        </button>
                      </template>
                    </div>
                  </div>
                </td>
                <td class="px-3 py-3 text-center whitespace-nowrap">
                  <template x-if="s.submitted_at">
                    <button @click.stop="navigate('/result/' + s.attempt_id)"
                            title="Klik untuk melihat detail jawaban siswa"
                            class="inline-flex items-center justify-center w-12 h-8 rounded-lg font-bold text-sm hover:scale-105 hover:shadow-md transition-all cursor-pointer"
                            :class="s.score >= 75 ? 'bg-green-100 text-green-700 dark:bg-green-900/40 dark:text-green-400' : s.score >= 60 ? 'bg-yellow-100 text-yellow-700 dark:bg-yellow-900/40 dark:text-yellow-400' : 'bg-red-100 text-red-600 dark:bg-red-900/40 dark:text-red-400'"
                            x-text="s.score"></button>
                  </template>
                  <template x-if="!s.submitted_at">
                    <span class="text-gray-300 dark:text-gray-600 text-xs">—</span>
                  </template>
                </td>
                <td class="px-3 py-3 text-center text-gray-500 dark:text-gray-400 whitespace-nowrap"
                    x-text="s.submitted_at && s.correct_count !== null ? s.correct_count : '—'"></td>
                <td class="px-3 py-3 text-center text-gray-500 dark:text-gray-400 whitespace-nowrap"
                    x-text="s.time_taken ? (Math.floor(s.time_taken/60) + 'm ' + (s.time_taken % 60) + 's') : '—'"></td>
                <td class="px-4 py-3 text-center whitespace-nowrap">
                  <template x-if="s.submitted_at">
                    <div>
                      <span class="text-xs text-gray-500 dark:text-gray-400 block whitespace-nowrap"
                            x-text="formatDateTime(s.submitted_at)"></span>
                      <template x-if="s.has_snapshots">
                        <button @click.stop="viewAssignmentSnapshots(s.attempt_id, routeParams[0])" 
                                class="mt-1 inline-flex items-center justify-center text-xs text-primary-600 hover:underline">
                          📷 Snapshots
                        </button>
                      </template>
                    </div>
                  </template>
                  <template x-if="!s.submitted_at">
                    <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-yellow-100 text-yellow-700 dark:bg-yellow-900/40 dark:text-yellow-400">
                      Belum
                    </span>
                  </template>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>

      <!-- Empty -->
      <div x-show="assignmentView.results && assignmentView.results.submissions && assignmentView.results.submissions.length === 0"
           class="text-center py-16 text-gray-400">
        <p class="text-4xl mb-3">📭</p>
        <p>Belum ada siswa yang mengumpulkan tugas</p>
      </div>
    </div>

  </div>

</div>

  <!-- ===== MODAL: SNAPSHOTS ===== -->
  <template x-teleport="body">
    <div x-show="assignmentView.snapshotModal?.show"
         x-cloak
         @keydown.escape.window="assignmentView.snapshotModal.show = false"
         @click="assignmentView.snapshotModal.show = false"
         class="modal-overlay z-[99999]"
         style="z-index: 99999;">
      <div class="bg-white dark:bg-gray-900 rounded-2xl shadow-2xl w-full max-w-4xl max-h-[88dvh] flex flex-col overflow-hidden my-auto"
           @click.stop>
        <!-- Modal Header -->
        <div class="flex items-center justify-between px-4 py-3 sm:px-6 sm:py-4 border-b border-gray-100 dark:border-gray-800 flex-shrink-0 bg-white dark:bg-gray-900">
          <h3 class="font-bold text-sm sm:text-base text-gray-900 dark:text-white flex items-center gap-2">
            <span>📷</span>
            <span>Rekaman Pengawasan (Proctoring)</span>
          </h3>
          <button @click="assignmentView.snapshotModal.show = false"
                  type="button"
                  class="w-8 h-8 sm:w-9 sm:h-9 flex items-center justify-center rounded-full bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-500 hover:text-gray-800 dark:text-gray-400 dark:hover:text-gray-100 transition-colors flex-shrink-0 shadow-sm"
                  aria-label="Tutup modal"
                  title="Tutup (Esc)">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>

        <!-- Modal Body (Scrollable) -->
        <div class="p-4 sm:p-6 overflow-y-auto flex-1">
          <div x-show="assignmentView.snapshotModal?.loading" class="flex items-center justify-center py-16">
            <div class="w-8 h-8 border-3 border-primary-200 border-t-primary-600 rounded-full animate-spin"></div>
          </div>
          <div x-show="!assignmentView.snapshotModal?.loading && (!assignmentView.snapshotModal?.snapshots || assignmentView.snapshotModal.snapshots.length === 0)" class="text-center text-gray-400 py-12">
            Belum ada snapshot yang tersimpan.
          </div>
          <div x-show="!assignmentView.snapshotModal?.loading && assignmentView.snapshotModal?.snapshots && assignmentView.snapshotModal.snapshots.length > 0" class="grid grid-cols-2 md:grid-cols-3 gap-3 sm:gap-4">
            <template x-for="snap in (assignmentView.snapshotModal?.snapshots || [])" :key="snap.id">
              <div class="card overflow-hidden border border-gray-100 dark:border-gray-800">
                <img :src="snap.image_path" class="w-full h-auto aspect-video object-cover bg-gray-50 dark:bg-gray-950" loading="lazy">
                <div class="p-2.5 sm:p-3 text-[11px] sm:text-xs text-center text-gray-500 dark:text-gray-400" x-text="formatDateTime(snap.created_at)"></div>
              </div>
            </template>
          </div>
        </div>

        <!-- Modal Footer (Mobile quick close button) -->
        <div class="px-4 py-3 sm:hidden border-t border-gray-100 dark:border-gray-800 bg-gray-50 dark:bg-gray-900/50 flex justify-end flex-shrink-0">
          <button @click="assignmentView.snapshotModal.show = false"
                  type="button"
                  class="btn-secondary w-full py-2 text-xs font-semibold justify-center">
            Tutup
          </button>
        </div>
      </div>
    </div>
  </template>
