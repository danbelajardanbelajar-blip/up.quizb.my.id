<!-- ASSIGNMENT STUDENT HISTORY PAGE -->
<div x-show="currentRoute.startsWith('/assignment/') && routeParams[1] === 'history'"
     class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-10">

  <div class="flex items-center gap-3 mb-6">
    <button @click="navigate('/assignment/' + routeParams[0] + '/results')"
            class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-500 transition-colors">
      ← Kembali ke Hasil Tugas
    </button>
    <div>
      <h1 class="text-xl font-bold text-gray-900 dark:text-white">
        Riwayat Percobaan: <span x-text="assignmentView.studentHistory?.student?.name"></span>
      </h1>
      <p class="text-sm text-gray-500 dark:text-gray-400"
         x-text="assignmentView.assignment?.title || '...'"></p>
    </div>
  </div>

  <!-- Loading -->
  <div x-show="assignmentView.loading" class="space-y-4">
    <div class="skeleton h-64 rounded-2xl"></div>
  </div>

  <!-- Content -->
  <div x-show="!assignmentView.loading && assignmentView.studentHistory">
    
    <div class="card overflow-hidden">
      <!-- MOBILE VIEW: Cards list (< 768px) -->
      <div class="md:hidden divide-y divide-gray-100 dark:divide-gray-800">
        <template x-for="(att, idx) in (assignmentView.studentHistory ? assignmentView.studentHistory.attempts : [])" :key="att.id">
          <div class="p-3.5 hover:bg-gray-50/60 dark:hover:bg-gray-800/40 transition-colors">
            <div class="flex items-center justify-between gap-2">
              <span class="font-bold text-xs text-gray-800 dark:text-gray-200"
                    x-text="'Percobaan Ke-' + (assignmentView.studentHistory.attempts.length - idx)"></span>
              <span class="inline-flex items-center justify-center w-12 h-7 rounded-lg font-bold text-xs shadow-xs"
                    :class="att.score >= 75 ? 'bg-green-100 text-green-700 dark:bg-green-900/40 dark:text-green-400' : att.score >= 60 ? 'bg-yellow-100 text-yellow-700 dark:bg-yellow-900/40 dark:text-yellow-400' : 'bg-red-100 text-red-600 dark:bg-red-900/40 dark:text-red-400'"
                    x-text="att.score"></span>
            </div>
            <div class="mt-2 pt-2 border-t border-gray-100/70 dark:border-gray-800/60 flex flex-wrap items-center justify-between gap-2 text-[11px] text-gray-500 dark:text-gray-400">
              <div class="flex items-center gap-3">
                <span class="inline-flex items-center gap-1 font-medium text-gray-700 dark:text-gray-300">
                  <span class="text-green-500">✓</span>
                  <span x-text="att.correct_count !== null ? att.correct_count + ' benar' : '—'"></span>
                </span>
                <span class="inline-flex items-center gap-1">
                  <span>⏱️</span>
                  <span x-text="att.time_taken ? (Math.floor(att.time_taken/60) + 'm ' + (att.time_taken % 60) + 's') : '—'"></span>
                </span>
              </div>
              <span x-text="formatDateTime(att.created_at)"></span>
            </div>
            <div class="mt-2.5 flex items-center gap-2">
              <button @click.stop="navigate('/result/' + att.attempt_id)"
                      class="flex-1 text-center text-xs font-semibold text-primary-600 hover:text-primary-700 bg-primary-50 dark:bg-primary-900/20 hover:bg-primary-100 py-1.5 rounded-lg transition-colors">
                Lihat Lembar Jawaban
              </button>
              <template x-if="att.has_snapshots">
                <button @click.stop="viewAssignmentSnapshots(att.attempt_id, routeParams[0])" 
                        class="text-xs font-semibold text-indigo-600 dark:text-indigo-400 bg-indigo-50 dark:bg-indigo-900/20 hover:bg-indigo-100 px-3 py-1.5 rounded-lg transition-colors">
                  📷 Snapshots
                </button>
              </template>
              <button @click.stop="deleteAssignmentAttempt(routeParams[0], att.attempt_id, assignmentView.studentHistory?.student?.name)" 
                      class="text-xs font-semibold text-red-600 dark:text-red-400 bg-red-50 dark:bg-red-900/20 hover:bg-red-100 dark:hover:bg-red-900/40 border border-red-200 dark:border-red-800/40 px-2.5 py-1.5 rounded-lg transition-colors"
                      title="Hapus percobaan ini">
                🗑️ Hapus
              </button>
            </div>
          </div>
        </template>
      </div>

      <!-- DESKTOP VIEW: Table (>= 768px) -->
      <div class="hidden md:block overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="bg-gray-50 dark:bg-gray-800/60">
            <tr>
              <th class="text-center px-4 py-3 font-semibold text-gray-600 dark:text-gray-400 w-24 whitespace-nowrap">Mencoba Ke-</th>
              <th class="text-center px-3 py-3 font-semibold text-gray-600 dark:text-gray-400 w-20 whitespace-nowrap">Skor</th>
              <th class="text-center px-3 py-3 font-semibold text-gray-600 dark:text-gray-400 w-20 whitespace-nowrap">Benar</th>
              <th class="text-center px-3 py-3 font-semibold text-gray-600 dark:text-gray-400 w-24 whitespace-nowrap">Waktu</th>
              <th class="text-center px-4 py-3 font-semibold text-gray-600 dark:text-gray-400 w-44 whitespace-nowrap">Tanggal Selesai</th>
              <th class="text-center px-4 py-3 font-semibold text-gray-600 dark:text-gray-400 whitespace-nowrap">Tindakan</th>
            </tr>
          </thead>
          <tbody>
            <template x-for="(att, idx) in (assignmentView.studentHistory ? assignmentView.studentHistory.attempts : [])" :key="att.id">
              <tr class="border-t border-gray-100 dark:border-gray-800 hover:bg-gray-50 dark:hover:bg-gray-800/40">
                <td class="px-4 py-4 text-center font-bold text-gray-500 whitespace-nowrap" x-text="assignmentView.studentHistory.attempts.length - idx"></td>
                
                <td class="px-3 py-3 text-center whitespace-nowrap">
                  <span class="inline-flex items-center justify-center w-12 h-8 rounded-lg font-bold text-sm"
                        :class="att.score >= 75 ? 'bg-green-100 text-green-700 dark:bg-green-900/40 dark:text-green-400' : att.score >= 60 ? 'bg-yellow-100 text-yellow-700 dark:bg-yellow-900/40 dark:text-yellow-400' : 'bg-red-100 text-red-600 dark:bg-red-900/40 dark:text-red-400'"
                        x-text="att.score"></span>
                </td>
                
                <td class="px-3 py-3 text-center text-gray-500 dark:text-gray-400 whitespace-nowrap"
                    x-text="att.correct_count !== null ? att.correct_count : '—'"></td>
                
                <td class="px-3 py-3 text-center text-gray-500 dark:text-gray-400 whitespace-nowrap"
                    x-text="att.time_taken ? (Math.floor(att.time_taken/60) + 'm ' + (att.time_taken % 60) + 's') : '—'"></td>
                
                <td class="px-4 py-3 text-center text-gray-500 dark:text-gray-400 whitespace-nowrap">
                  <span x-text="formatDateTime(att.created_at)"></span>
                </td>
                
                <td class="px-4 py-3 text-center whitespace-nowrap">
                  <div class="flex items-center justify-center gap-2">
                    <button @click.stop="navigate('/result/' + att.attempt_id)"
                            class="text-xs font-medium text-primary-600 hover:text-primary-700 bg-primary-50 hover:bg-primary-100 px-3 py-1.5 rounded-lg transition-colors">
                      Lihat Lembar Jawaban
                    </button>
                    
                    <template x-if="att.has_snapshots">
                      <button @click.stop="viewAssignmentSnapshots(att.attempt_id, routeParams[0])" 
                              class="text-xs font-medium text-indigo-600 hover:text-indigo-700 bg-indigo-50 hover:bg-indigo-100 px-3 py-1.5 rounded-lg transition-colors">
                        📷 Snapshots
                      </button>
                    </template>
                    <button @click.stop="deleteAssignmentAttempt(routeParams[0], att.attempt_id, assignmentView.studentHistory?.student?.name)" 
                            class="text-xs font-medium text-red-600 hover:text-red-700 bg-red-50 hover:bg-red-100 border border-red-200 dark:border-red-800/40 px-2.5 py-1.5 rounded-lg transition-colors"
                            title="Hapus percobaan ini">
                      🗑️ Hapus
                    </button>
                  </div>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>

      <!-- Empty -->
      <div x-show="assignmentView.studentHistory && assignmentView.studentHistory.attempts.length === 0"
           class="text-center py-12 text-gray-400">
        <p class="text-3xl mb-3">📭</p>
        <p>Belum ada riwayat percobaan tugas untuk siswa ini.</p>
      </div>
    </div>
    
    <div class="mt-4 text-xs text-gray-400 text-center flex items-center justify-center gap-1.5">
      <svg class="w-4 h-4 text-yellow-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
      Sistem membatasi penyimpanan foto pengawasan (snapshot) maksimum 5 percobaan terakhir untuk menghemat memori.
    </div>
  </div>

</div>
